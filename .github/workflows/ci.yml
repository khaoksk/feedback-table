name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Same Postgres major version as docker-compose.yml, so query plans and
    # query counts match local runs (the tests assert both).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: feedback
          POSTGRES_USER: feedback
          POSTGRES_PASSWORD: feedback
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feedback"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: feedback
      POSTGRES_USER: feedback
      POSTGRES_PASSWORD: feedback
      DJANGO_DEBUG: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: flake8 feedback config

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Test
        run: pytest
